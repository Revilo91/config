- id: '1714122775476'
  alias: Feuerwehreinsatz Haussteuerung
  description: ''
  triggers:
  - entity_id:
    - binary_sensor.apager_alarm
    - binary_sensor.tpg2200_alarmrelais
    - input_boolean.feuerwehralarm
    from: 'off'
    to: 'on'
    trigger: state
  conditions:
  - condition: state
    entity_id: person.oliver
    state: home
  - condition: state
    entity_id: binary_sensor.schlafenszeit
    state:
    - 'off'
  - condition: switch.is_off
    target:
      entity_id: input_boolean.babygeschrei
    options:
      behavior: any
      for: 00:00:00
  actions:
  - action: scene.create
    metadata: {}
    data:
      snapshot_entities:
      - light.flur_eg
      - light.gardrobe
      - light.wohnzimmer_licht
      - light.ankleide_licht
      - cover.garagentor
      - lock.garagentor_warnung
      - input_boolean.feuerwehralarm_zurucksetzten
      - input_boolean.feuerwehralarm
      - media_player.gong_gong
      scene_id: vor_alarm_licht
  - alias: Garagentor öffnen
    if:
    - condition: garage_door.is_closed
      target:
        label_id: licht_alarm
      options:
        behavior: all
    then:
    - data: {}
      target:
        label_id: licht_alarm
      enabled: true
      action: cover.open_cover
  - alias: 'Garagenwarung aus '
    action: lock.lock
    target:
      label_id: licht_alarm
    data: {}
  - action: input_boolean.turn_on
    metadata: {}
    data: {}
    target:
      entity_id: input_boolean.feuerwehralarm_zurucksetzten
  - data: {}
    target:
      label_id: licht_alarm
    alias: Licht an
    action: light.turn_on
  - alias: Wenn aPager auslöst, Gong abspielen
    if:
    - condition: state
      entity_id: binary_sensor.apager_alarm
      state: 'on'
    then:
    - alias: Gong
      target:
        label_id: licht_alarm
      data:
        media:
          media_content_id: media-source://tts/google_translate?message={{states("sensor.apager_keyword")}}&language=de
          media_content_type: provider
          metadata:
            title: Alarmmeldung
            thumbnail: https://brands.home-assistant.io/_/google_translate/logo.png
            media_class: app
            children_media_class:
            navigateIds:
            - {}
            - media_content_type: app
              media_content_id: media-source://tts
            - media_content_type: provider
              media_content_id: media-source://tts/google_translate?message={{states("sensor.apager_keyword")}}&language=de
        announce: true
      action: media_player.play_media
    - alias: Gong Lokal
      action: tts.speak
      target:
        entity_id: tts.google_ai_tts
      data:
        cache: true
        media_player_entity_id: media_player.gong_gong
        message: '{{ states(''sensor.apager_keyword'') }}'
        language: de
      enabled: false
  mode: single
