      message: "{% set current_count = int(state_attr(\"sensor.mitgliedsgemeinde_in_verwaltungsgemeinschaft_langquaid_vorwarnstufe\",
        \"warning_count\"), 0) %} {% set weekdays = {'Mon': 'Mo', 'Tue': 'Di', 'Wed':
        'Mi', 'Thu': 'Do', 'Fri': 'Fr', 'Sat': 'Sa', 'Sun': 'So'} %} {% if current_count
        > 0 %} <h2><font color=red>DWD Vorwarnungen</font></h2><hr><hr> {% endif %}
        {% for i in range(current_count) %}\n  {% set headline = state_attr(\"sensor.mitgliedsgemeinde_in_verwaltungsgemeinschaft_langquaid_vorwarnstufe\",
        \"warning_\" ~ loop.index ~ \"_headline\") %}\n  {% set description = state_attr(\"sensor.mitgliedsgemeinde_in_verwaltungsgemeinschaft_langquaid_vorwarnstufe\",
        \"warning_\" ~ loop.index ~ \"_description\") %}\n  {% set level = state_attr(\"sensor.mitgliedsgemeinde_in_verwaltungsgemeinschaft_langquaid_vorwarnstufe\",
        \"warning_\" ~ loop.index ~ \"_level\") %}\n  {% set time_start = state_attr(\"sensor.mitgliedsgemeinde_in_verwaltungsgemeinschaft_langquaid_vorwarnstufe\",
        \"warning_\" ~ loop.index ~ \"_start\") | as_local %}\n  {% set time_end =
        state_attr(\"sensor.mitgliedsgemeinde_in_verwaltungsgemeinschaft_langquaid_vorwarnstufe\",
        \"warning_\" ~ loop.index ~ \"_end\") | as_local %}\n  {% set level_color
        = state_attr(\"sensor.mitgliedsgemeinde_in_verwaltungsgemeinschaft_langquaid_vorwarnstufe\",
        \"warning_\" ~ loop.index ~ \"_color\") %}\n  <b><font color={{ level_color
        }}>{{ headline }}</font></b> <br>\n  <u>{{ weekdays[time_start.strftime(\"%a\")]
        ~ \". \" ~ time_start.strftime(\"%H:%M\") ~ \" - \" ~ weekdays[time_end.strftime(\"%a\")]
        ~ \". \" ~ time_end.strftime(\"%H:%M\") }}</u> <br>\n  <i>{{ description }}</i>
        <hr>\n{% endfor %} {% set advance_count = int(state_attr(\"sensor.mitgliedsgemeinde_in_verwaltungsgemeinschaft_langquaid_aktuelle_warnstufe\",
        \"warning_count\"), 0) %} {% if advance_count > 0 %} <h2><font color=red>DWD
        Aktuelle Warnungen</font></h2><hr><hr> {% endif %} {% for i in range(advance_count)
        %}\n  {% set headline = state_attr(\"sensor.mitgliedsgemeinde_in_verwaltungsgemeinschaft_langquaid_aktuelle_warnstufe\",
        \"warning_\" ~ loop.index ~ \"_headline\") %}\n  {% set description = state_attr(\"sensor.mitgliedsgemeinde_in_verwaltungsgemeinschaft_langquaid_aktuelle_warnstufe\",
        \"warning_\" ~ loop.index ~ \"_description\") %}\n  {% set level = state_attr(\"sensor.mitgliedsgemeinde_in_verwaltungsgemeinschaft_langquaid_aktuelle_warnstufe\",
        \"warning_\" ~ loop.index ~ \"_level\") %}\n  {% set time_start = state_attr(\"sensor.mitgliedsgemeinde_in_verwaltungsgemeinschaft_langquaid_aktuelle_warnstufe\",
        \"warning_\" ~ loop.index ~ \"_start\") | as_local %}\n  {% set time_end =
        state_attr(\"sensor.mitgliedsgemeinde_in_verwaltungsgemeinschaft_langquaid_aktuelle_warnstufe\",
        \"warning_\" ~ loop.index ~ \"_end\") | as_local %}\n  {% set level_color
        = state_attr(\"sensor.mitgliedsgemeinde_in_verwaltungsgemeinschaft_langquaid_aktuelle_warnstufe\",
        \"warning_\" ~ loop.index ~ \"_color\") %}\n  <b><font color={{ level_color
        }}>{{ headline }}</font></b> <br>\n  <u>{{ weekdays[time_start.strftime(\"%a\")]
        ~ \". \" ~ time_start.strftime(\"%H:%M\") ~ \" - \" ~ weekdays[time_end.strftime(\"%a\")]
        ~ \". \" ~ time_end.strftime(\"%H:%M\") }}</u> <br>\n  <i>{{ description }}</i>
        <hr>\n{% endfor %}"
    action: persistent_notification.create
  mode: single
