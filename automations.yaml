- id: '1762168377405'
  alias: Energieoptimierte Heizungssteuerung
  description: PV-Überschuss → Komfort; Netzbezug → Reset
  triggers:
  - trigger: homeassistant
    event: start
    id: Start
  - trigger: numeric_state
    entity_id: sensor.smartmeter_power
    for: 00:00:30
    below: -300
    id: Überschuss
  - trigger: numeric_state
    entity_id: sensor.smartmeter_power
    for: 00:05:00
    above: 500
    id: Netzbezug
  - trigger: state
    entity_id: climate.bad_og_thermostat
    id: Thermostat
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id:
        - Überschuss
        - Start
      - condition: numeric_state
        entity_id: sensor.smartmeter_power
        below: -300
      sequence:
      - action: climate.turn_on
        target:
          entity_id: climate.comfoclime_comfoclime_24
        data: {}
      - choose:
        - alias: Heizmodus (~400W)
          conditions:
          - condition: state
            entity_id: select.comfoclime_comfoclime_24_jahreszeitwahl
            state:
            - heating
          sequence:
          - action: climate.set_temperature
            data:
              temperature: 23
              hvac_mode: heat
            target:
              entity_id: climate.comfoclime_comfoclime_24
          - action: climate.set_fan_mode
            data:
              fan_mode: high
            target:
              entity_id: climate.comfoclime_comfoclime_24
        - alias: Kühlmodus (~200W)
          conditions:
          - condition: state
            entity_id: select.comfoclime_comfoclime_24_jahreszeitwahl
            state:
            - cooling
          sequence:
          - action: climate.set_temperature
            data:
              temperature: 18
              hvac_mode: cool
            target:
              entity_id: climate.comfoclime_comfoclime_24
          - action: climate.set_fan_mode
            data:
              fan_mode: medium
            target:
              entity_id: climate.comfoclime_comfoclime_24
        - alias: Übergangsmodus
          conditions:
          - condition: state
            entity_id: select.comfoclime_comfoclime_24_jahreszeitwahl
            state:
            - transition
          sequence:
          - action: climate.set_temperature
            data:
              temperature: 22
              hvac_mode: fan_only
            target:
              entity_id: climate.comfoclime_comfoclime_24
          - action: climate.set_fan_mode
            data:
              fan_mode: medium
            target:
              entity_id: climate.comfoclime_comfoclime_24
      - if:
        - condition: state
          entity_id: select.comfoclime_comfoclime_24_jahreszeitwahl
          state:
          - heating
        - condition: state
          entity_id: timer.timer_og_bad_heizung
          state: idle
        - condition: numeric_state
          entity_id: sensor.smartmeter_power
          below: -700
        - condition: template
          value_template: '{{ state_attr(''climate.bad_og_thermostat'', ''current_temperature'')
            < float(states(''sensor.og_badezimmer_thermostat_og_bad_heizung_schwellenwert''))
            }}

            '
        then:
        - action: switch.turn_on
          target:
            entity_id: switch.elektroheizung
        else:
        - action: switch.turn_off
          target:
            entity_id: switch.elektroheizung
    - conditions:
      - condition: trigger
        id: Netzbezug
      sequence:
      - parallel:
        - alias: 'Comfoclime einstellen '
          sequence:
          - action: climate.set_temperature
            data:
              temperature: 21
            target:
              entity_id: climate.comfoclime_comfoclime_24
          - action: climate.set_fan_mode
            data:
              fan_mode: medium
            target:
              entity_id: climate.comfoclime_comfoclime_24
        - action: switch.turn_off
          target:
            entity_id: switch.elektroheizung
          data: {}
    - conditions:
      - condition: trigger
        id: Thermostat
      - condition: state
        entity_id: timer.timer_og_bad_heizung
        state: idle
      - condition: state
        entity_id: select.comfoclime_comfoclime_24_jahreszeitwahl
        state:
        - heating
      sequence:
      - if:
        - condition: numeric_state
          entity_id: sensor.smartmeter_power
          below: -700
        - condition: template
          value_template: '{{ state_attr(''climate.bad_og_thermostat'', ''current_temperature'')
            < float(states(''sensor.og_badezimmer_thermostat_og_bad_heizung_schwellenwert''))
            }}

            '
        then:
        - action: switch.turn_on
          target:
            entity_id: switch.elektroheizung
        else:
        - action: switch.turn_off
          target:
            entity_id: switch.elektroheizung
  mode: restart
- id: '1763015204641'
  alias: Weihnachtsbeleuchtung - Prüfe alle Steckdosen
  description: ''
  triggers:
  - trigger: light.turned_on
    target:
      entity_id:
      - light.weihnachtsbaum
