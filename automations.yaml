              group: '{{ device_name }}'
              channel: Haushalt
              notification_icon: '{{ device_icon }}'
              actions:
              - action: haushalt_acknowledge
                title: Bestätigen
      - delay:
          minutes: 1
      until:
      - condition: template
        value_template: '{{ is_state(switch_entity, ''off'') or repeat.index >= 5
          }}'
  variables:
    device_name: '{{ ''Waschmaschine'' if trigger.id == ''waschmaschine'' else ''Trockner''
      }}'
