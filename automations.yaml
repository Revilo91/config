  conditions:
  - condition: template
    value_template: "{{ trigger.to_state is not none and\n   (trigger.from_state is
      none or\n    trigger.to_state.state != trigger.from_state.state) }}\n"
  actions:
  - data:
      message: '{% set name = trigger.to_state.name %} {% set zone_map = {''home'':
        ''Zuhause'', ''not_home'': ''Unterwegs''} %} {% set from = trigger.from_state.state                if
        trigger.from_state is not none               else "unknown" %} {% set from
        = zone_map.get(from, from) %}  {% set to = trigger.to_state.state %} {% set
        to = zone_map.get(to, to) %}  {{ name }}: {{ from }} » {{ to }}'
      data:
        tag: '{{trigger.to_state.name}}'
        group: Zonenbenachrichtigung
