- id: '1781107865242'
  alias: 'Frigate: Zonen-Benachrichtigung'
  triggers:
  - trigger: mqtt
    options:
      topic: frigate/events
  conditions:
  - condition: template
    value_template: "{{ trigger.payload_json.after.camera != 'babyfon'\n   and (trigger.payload_json.after.entered_zones
      | default([], true))\n   | reject('in', trigger.payload_json.before.entered_zones
      | default([], true))\n   | list | length > 0 }}\n"
    enabled: false
  - condition: template
    value_template: '{{ trigger.payload_json.after.camera != ''babyfon'' and trigger.payload_json.type
      == ''new''}}

      '
