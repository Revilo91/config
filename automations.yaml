- id: '1787288639387'
  alias: Wartung · Tagesreport dauerhaft offline
  description: Meldet einmal täglich alle steuerbaren Entitäten, die seit über 24
    h unavailable sind. Bekannte Dauerbaustellen (ebusd, padspan) sind gefiltert.
  triggers:
  - trigger: time
    at: '18:30:00'
  conditions:
  - alias: HA läuft lange genug für eine sinnvolle 24h-Aussage
    condition: template
    value_template: '{{ (now() - states.sun.sun.last_changed).total_seconds() < 86400
      }}'
  actions:
  - variables:
      offline: "{% set ns = namespace(l=[]) %} {% for s in states %}\n  {% if s.state
        == 'unavailable'\n        and s.domain in ['light','switch','cover','climate','lock',\n
        \                        'fan','vacuum','camera','media_player','binary_sensor']\n
        \       and 'ebusd' not in s.entity_id\n        and 'padspan' not in s.entity_id\n
        \       and (now() - s.last_changed).total_seconds() > 86400 %}\n    {% set
        ns.l = ns.l + [s.name] %}\n  {% endif %}\n{% endfor %} {{ ns.l | sort }}"
  - condition: template
    value_template: '{{ offline | count > 0 }}'
  - action: notify.mobile_app_pixel_8a
    data:
      title: "\U0001F527 {{ offline | count }} Entitäten offline (>24 h)"
      message: "{{ offline[:12] | join(' · ') }}{{ ' …und %d weitere' | format(offline
        | count - 12)\n   if offline | count > 12 else '' }}"
      data:
        tag: offline-report
        group: wartung
        channel: Wartung
  - action: todo.add_item
    target:
      entity_id: todo.haushalt_2
    data:
      item: '{{ offline | count }} HA-Entitäten offline ({{ now().strftime(''%d.%m.'')
        }})'
      description: '{{ offline | join('', '') }}'
    continue_on_error: true
  mode: single
