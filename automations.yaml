  - repeat:
      sequence:
      - if:
        - condition: state
          entity_id: schedule.benachrichtungszeitraum
          state: 'on'
        then:
        - action: notify.familie
          data:
            title: '{{ device_name }}'
            message: '{{ device_name }} fertig seit: {{ as_datetime(states[switch_entity].last_changed)
              | as_local | as_timestamp | timestamp_custom(''%d.%m.%Y %H:%M'') }}'
