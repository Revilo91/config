- id: '1774857183582'
  alias: Batterie Warnung zu To-Do
  description: Erstellt oder aktualisiert einen To-Do Eintrag bei schwacher Batterie.
  triggers:
  - trigger: battery.became_low
    target:
      label_id: leere_batterie
    options:
      behavior: each
  actions:
  - target:
      entity_id: todo.haushalt_2
    response_variable: t_list
    action: todo.get_items
    data:
      status: needs_action
  - variables:
      base_name: 'Batterie leer: {{ state_attr(trigger.entity_id, ''device_name'')
        }}'
      match: '{{ t_list[''todo.haushalt_2''][''items''] | selectattr(''summary'',
        ''search'', base_name) | list }}'
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ match | length > 0 }}'
      sequence:
      - target:
          entity_id: todo.haushalt_2
        data:
          item: '{{ match[0].uid }}'
          rename: "{% set parts = match[0].summary.split('(') %} {% set count = (parts[1].split('x')[0]
            | int + 1) if parts | length > 1 else 2 %} \n{{ base_name }} ({{ count
            }}x)\n"
        action: todo.update_item
    default:
    - target:
        entity_id: todo.haushalt_2
      data:
        item: '{{ base_name }} (1x)'
        due_date: '{{ (now() + timedelta(days=1)).strftime(''%Y-%m-%d'') }}'
      action: todo.add_item
  mode: parallel
