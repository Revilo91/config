weather_and_comfort_report:
  alias: Weather and comfort report
  sequence:
  - action: ai_task.generate_data
    data:
      task_name: weather comfort report
      instructions: 'Basierend auf den aktuellen Bedingungen:

        - Außentemperatur: {{ states(''sensor.durchschnittstemperatur'') }}°C

        - Wetter: {{ states(''weather.forecast_home'') }}

        - Innen Temperatur: {{ states(''sensor.durchschnittstemperatur_haus'') }}°C

        - Innen Luftfeuchtigkeit: {{ states(''sensor.durchschnittsluftfeuchtigkeit_haus'') }}%


        Erstellen Sie eine lustige Wetterbeschreibung und bewerten Sie den Komfort im Innenbereich.

        '
      structure:
        weather_description:
          description: Eine humorvolle Beschreibung des aktuellen Wetters draußen
          required: true
          selector:
            text:
        indoor_comfort:
          description: Einschätzung, wie komfortabel es drinnen im Vergleich zu draußen ist
          required: true
          selector:
            text:
    response_variable: comfort_report
  - action: notify.persistent_notification
    data:
      title: "🏠 Home climate report"
      message: "🌤️ **Wetter draußen:**

        {{ comfort_report.data.weather_description }}


        🛋️ **Komfort im Innenbereich:**

        {{ comfort_report.data.indoor_comfort }}\n"
  description: ''
comfoclime_modus_setzen:
  alias: ComfoClime Modus setzen
  sequence:
  - variables:
      settings:
        heating:
          temp: 23
          mode: heat
        cooling:
          temp: 18
          mode: cool
        transition:
          temp: 22
          mode: fan_only
      state: '{{ states(''select.comfoclime_24_jahreszeitwahl'') }}'
  - action: climate.set_temperature
    target:
      entity_id: climate.comfoclime_comfoclime_24
    data:
      temperature: '{{ settings[state].temp | default(22) }}'
      hvac_mode: '{{ settings[state].mode | default(''off'') }}'
  description: ''
  icon: mdi:hvac
