sensor:
  - name: "Rasenmäher Mähzyklus"
    unique_id: rasenmaher_mahzyklus
    device_class: enum
    state: >
      {% set month = now().month %}
      {% if month in [4, 5, 6] %}
        stark
      {% elif month in [3, 7, 8, 9] %}
        moderat
      {% elif month == 10 %}
        schwach
      {% else %}
        ruhephase
      {% endif %}
    icon: >
      {% set state = states('sensor.rasenmaher_mahzyklus') %}
      {% if state == 'stark' %}
        mdi:grass
      {% elif state == 'moderat' %}
        mdi:sprout
      {% elif state == 'schwach' %}
        mdi:leaf
      {% else %}
        mdi:snowflake
      {% endif %}

  - name: "Wetterwarnungen"
    unique_id: wetterwarnungen
    state: >
      {{ label_entities("Warnung") | default([]) 
          | map('states') 
          | reject('in', ['off', 'unknown', 'unavailable']) 
          | map('float', 0) 
          | select('>', 0) 
          | list 
          | count 
      }}