binary_sensor:
- name: "Tür offen"
  unique_id: "tur_offen"
  state: >-
    {{label_entities('turkontakt') | select('is_state', 'on') | list | count > 0 }}
  attributes:
    list: >-
      {{label_entities('turkontakt') | select('is_state', 'on') | sort(attribute='friendly_name') | map('state_attr', 'friendly_name') | sort | list }}
    count: >-
      {{label_entities('turkontakt') | select('is_state', 'on') | list | count }}

