# Cover to Fensterkontakt
cover.esszimmer_rollladen_1:
  window: [ "binary_sensor.esszimmer_turkontakt" ]
  taster_hoch: [ "event.em_1_esszimmer_rollladen_hoch" ]
  taster_runter: [ "event.em_1_esszimmer_rollladen_runter" ]
  direction: "suden"
