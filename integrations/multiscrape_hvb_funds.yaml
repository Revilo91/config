- name: HVB Fund 1
  resource: https://kurse.hypovereinsbank.de/hvb-markets/funds/Overview.htm?id=19543173
  scan_interval: 60
  sensor:
    - unique_id: hvb_fund_19543173_price
      name: "HVB Fund 19543173"
      select: r"#prices.quote.price"
      value_template: "{{ value | replace(',', '.') | float }}"
      unit_of_measurement: "€"
      device_class: monetary
      state_class: measurement
      attributes:
        - name: fund_name
          select: r"#derivatives.descriptor.name_security"
          value_template: "{{ value }}"
        - name: fund_id
          value_template: "19543173"

