sensor:
# --- Zählernummer (String, kein numerischer Sensor) ---
- name: "Smartmeter Zählernummer"
  unique_id: smartmeter_id
  state_topic: "tele/smartmeter_3C7D10/SENSOR"
  value_template: "{{ value_json.LK13BE.id | default(this.state) }}"
  entity_category: diagnostic

# --- Energie ---
- name: "Smartmeter Zählerstand Bezug"
  unique_id: smartmeter_total_in
  state_topic: "tele/smartmeter_3C7D10/SENSOR"
  value_template: "{{ value_json.LK13BE.total_in | default(this.state) }}"
  unit_of_measurement: "kWh"
  device_class: energy
  state_class: total_increasing
  availability_topic: "tele/smartmeter_3C7D10/LWT"
  payload_available: "Online"
  payload_not_available: "Offline"

- name: "Smartmeter Zählerstand Einspeisung"
  unique_id: smartmeter_total_out
  state_topic: "tele/smartmeter_3C7D10/SENSOR"
  value_template: "{{ value_json.LK13BE.total_out | default(this.state) }}"
  unit_of_measurement: "kWh"
  device_class: energy
  state_class: total_increasing

# --- Leistung (ersetzt sensor.smartmeter_power) ---
- name: "Smartmeter Power"
  unique_id: smartmeter_power
  state_topic: "tele/smartmeter_3C7D10/SENSOR"
  value_template: "{{ value_json.LK13BE.power | default(this.state) }}"
  unit_of_measurement: "W"
  device_class: power
  state_class: measurement

